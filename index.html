<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัวของฉัน</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        .profile-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 5px solid #007bff; margin-bottom: 20px; }
        h1 { margin: 10px 0; color: #333; font-size: 24px; }
        .position { color: #007bff; font-weight: bold; margin-bottom: 20px; }
        .info-section { text-align: left; background: #fafafa; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .info-title { font-weight: bold; color: #555; margin-bottom: 10px; border-bottom: 2px solid #007bff; padding-bottom: 5px; }
        p { color: #666; line-height: 1.6; margin: 8px 0; }
        .bold { font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <div class="card">
        <!-- ใส่ลิงก์รูปภาพของคุณในเครื่องหมายคำพูดด้านล่างนี้ -->
        <img src="https://placeholder.com" alt="รูปโปรไฟล์" class="profile-img">
        
        <h1>ชื่อ - นามสกุลของคุณ</h1>
        <div class="position">นักเรียน / นักพัฒนาเว็บไซต์</div>
        
        <div class="info-section">
            <div class="info-title">ข้อมูลส่วนตัว</div>
            <p><span class="bold">อายุ:</span> 18 ปี</p>
            <p><span class="bold">อีเมล:</span> youremail@email.com</p>
            <p><span class="bold">เบอร์โทร:</span> 08X-XXX-XXXX</p>
        </div>

        <div class="info-section">
            <div class="info-title">การศึกษา</div>
            <p>โรงเรียนของคุณ (พ.ศ. 25XX - 25XX)</p>
        </div>

        <div class="info-section">
            <div class="info-title">ทักษะความสามารถ</div>
            <p>HTML, CSS, JavaScript, คอมพิวเตอร์เบื้องต้น</p>
        </div>
    </div>

</body>
</html>
