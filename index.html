<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าหลัก | Portfolio Apitchaya</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma,sans-serif;
    background:#FFF5FA;
    color:#6B3556;
}

header{
    background:linear-gradient(135deg,#FF69B4,#FFC0CB);
    color:white;
    text-align:center;
    padding:30px;
}

nav{
    background:#FFB6C1;
    text-align:center;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 12px;
    font-weight:bold;
}

nav a:hover{
    color:#E91E63;
}

main{
    width:90%;
    max-width:1000px;
    margin:40px auto;
}

.hero{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 15px rgba(255,105,180,.3);
}

.hero img{
    width:220px;
    height:220px;
    border-radius:50%;
    border:6px solid #FF69B4;
    object-fit:cover;
    margin-bottom:20px;
}

.hero h2{
    color:#E91E63;
    margin-bottom:15px;
    font-size:36px;
}

.hero p{
    font-size:18px;
    line-height:1.8;
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 25px;
    background:#FF69B4;
    color:white;
    text-decoration:none;
    border-radius:25px;
}

.btn:hover{
    background:#E91E63;
}

.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-top:40px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    text-align:center;
    box-shadow:0 5px
