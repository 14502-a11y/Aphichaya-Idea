<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FFF0F5; /* สีชมพูอ่อน LavenderBlush */
            color: #4A4A4A;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .profile-card {
            background-color: #FFFFFF;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4); /* เงาสีชมพูจางๆ */
            width: 350px;
            text-align: center;
            border: 2px solid #FFB6C1; /* ขอบสีชมพู LightPink */
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #FFC0CB; /* สีชมพู Pink */
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            color: #FFF;
        }
        h1 {
            color: #FF69B4; /* หัวข้อสีชมพูเข้ม HotPink */
            font-size: 24px;
            margin-bottom: 5px;
        }
        .nickname {
            color: #FFB6C1; /* ชื่อเล่นสีชมพู LightPink */
            font-weight: bold;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin: 10px 0;
            text-align: left;
        }
        strong {
            color: #FF69B4; /* เน้นข้อความด้วยสีชมพู */
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- ส่วนรูปภาพ (สามารถเปลี่ยน src เป็นลิงก์รูปของคุณได้ในโฟลเดอร์ images) -->
        <div class="avatar">รูปภาพของคุณ</div>
        
        <h1>ชื่อ-นามสกุลของคุณ</h1>
        <div class="nickname">(ชื่อเล่นของคุณ)</div>
        
        <p><strong>การศึกษา</strong>: มหาวิทยาลัย / โรงเรียนของคุณ</p>
        <p><strong>ความสามารถ</strong>: ทักษะหรือสิ่งที่คุณถนัด</p>
        <p><strong>งานอดิเรก</strong>: สิ่งที่ชอบทำในเวลาว่าง</p>
        <p><strong>คติประจำใจ</strong>: ข้อคิดเตือนใจของคุณ</p>
    </div>

</body>
</html>
