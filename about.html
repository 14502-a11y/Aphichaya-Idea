<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ประวัติส่วนตัว</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Kanit',sans-serif;
}

body{
    background:linear-gradient(135deg,#FFE6F2,#FFF7FB,#FFEAF4);
}

/* เมนู */
nav{
    background:#fff;
    padding:18px;
    text-align:center;
    box-shadow:0 3px 10px rgba(255,105,180,.2);
}

nav a{
    text-decoration:none;
    color:white;
    background:#FF69B4;
    padding:10px 20px;
    margin:5px;
    border-radius:30px;
    display:inline-block;
    transition:.3s;
}

nav a:hover{
    background:#E91E63;
}

/* กล่อง */
.card{
    width:90%;
    max-width:900px;
    margin:40px auto;
    background:#fff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 8px 20px rgba(255,105,180,.2);
}

.title{
    text-align:center;
    color:#E91E63;
    margin-bottom:30px;
    font-size:36px;
}

.about-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.about-card{
    background:#FFF0F5;
    border-radius:18px;
    padding:20px;
    text-align:center;
}

.about-card h3{
    color:#E91E63;
    margin-bottom:10px;
}

/* ปุ่มล่าง */
.button-box{
    display:flex;
    justify-content:space-between;
    margin-top:40px;
}

.button-box a{
    text-decoration:none;
    background:#FF69B4;
    color:white;
    padding:12px 28px;
    border-radius:30px;
    font-size:18px;
    transition:.3s;
}

.button-box a:hover{
    background:#E91E63;
}

</style>

</head>
<body>

<nav>
    <a href="index.html">🏠 หน้าหลัก</a>
    <a href="about.html">👤 ประวัติส่วนตัว</a>
    <a href="education.html">🎓 การศึกษา</a>
    <a href="portfolio.html">🏆 ผลงาน</a>
    <a href="contact.html">📞 ติดต่อ</a>
</nav>

<section class="card">

<h2 class="title">ประวัติส่วนตัว</h2>

<div class="about-grid">

<div class="about-card">
<h3>ชื่อเล่น</h3>
<p>ไอเดีย</p>
</div>

<div class="about-card">
<h3>วันเกิด</h3>
<p>7 มิถุนายน 2552</p>
</div>

<div class="about-card">
<h3>ความสามารถพิเศษ</h3>
<p>เต้น ร้องเพลง เล่นดนตรี</p>
</div>

<div class="about-card">
<h3>งานอดิเรก</h3>
<p>ฟังเพลง เล่นเกม</p>
</div>

</div>

<!-- ปุ่ม -->
<div class="button-box">
    <a href="index.html">⬅ ย้อนกลับ</a>
    <a href="education.html">หน้าถัดไป ➜</a>
</div>

</section>

</body>
</html>
