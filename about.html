<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>About Me | Apichaya Busuwa</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Kanit',sans-serif;
}

body{

background:linear-gradient(135deg,#FFE6F2,#FFF5FA,#FFEFF7);

overflow-x:hidden;

color:#555;

}

/* ดอกไม้ */

.flower{

position:fixed;

font-size:28px;

animation:fall linear infinite;

pointer-events:none;

opacity:.8;

z-index: 999;

}

.f1{left:5%;animation-duration:8s;}
.f2{left:20%;animation-duration:10s;}
.f3{left:35%;animation-duration:7s;}
.f4{left:50%;animation-duration:9s;}
.f5{left:65%;animation-duration:11s;}
.f6{left:80%;animation-duration:8s;}
.f7{left:95%;animation-duration:10s;}

@keyframes fall{

0%{
transform:translateY(-100px) rotate(0deg);
}

100%{
transform:translateY(110vh) rotate(360deg);
}

}

/* เมนู */

nav{

position:sticky;

top:0;

background:rgba(255,255,255,.9);

padding:18px;

text-align:center;

backdrop-filter:blur(10px);

box-shadow:0 5px 15px rgba(0,0,0,.08);

z-index: 1000;

}

nav a{

text-decoration:none;

margin:0 18px;

color:#ff4f94;

font-size:18px;

font-weight:600;

transition: .3s;

display: inline-block;

}

nav a:hover{

color:#ff2d7a;

}

/* กล่องหลัก */

.container{

max-width:1000px;

margin:60px auto;

padding: 0 20px;

}

.card{

background:white;

border-radius:35px;

padding:50px;

box-shadow:0 15px 35px rgba(255,105,180,.18);

}

/* รูป */

.profile{

text-align:center;

margin-bottom:40px;

}

.profile img{

width:220px;

height:220px;

border-radius:50%;

object-fit:cover;

border:8px solid #FFD6E8;

box-shadow:0 10px 30px rgba(255,105,180,.25);

transition:.4s;

}
