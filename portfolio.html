*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Kanit',sans-serif;
}

body{
    background:linear-gradient(135deg,#ffe4f2,#ffd6ea,#fff7fb);
}

header{
    background:#ff69b4;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    font-size:28px;
    font-weight:bold;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:20px;
}

nav ul li a{
    color:white;
    text-decoration:none;
}

nav ul li a:hover{
    color:#ffe4f2;
}

.container{
    max-width:1100px;
    margin:40px auto;
    padding:20px;
}

.container h1{
    text-align:center;
    color:#ff4f9f;
    margin-bottom:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(255,105,180,.2);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card-content h2{
    color:#ff4f9f;
    margin-bottom:10px;
    font-size:22px;
}

.card-content p{
    color:#555;
    line-height:1.7;
}
